plugins {
    id 'com.android.application'
    id 'com.android.legacy-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'unicon.metro.kharkiv'
    compileSdk 37

    defaultConfig {
        applicationId "unicon.metro.kharkiv"

        minSdk 24
        targetSdk 37

        versionCode 36
        versionName '3.1.3'
        resourceConfigurations += ['en', 'uk', 'ru', 'pl']

    }
    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', '**.kotlin_builtins', '**.kotlin_metadata']
        }
    }

    buildTypes {
        release {
            // Debug keystore signing so the APK installs directly
            // (tap-to-install, no adb needed).
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.afollestad.material-dialogs:bottomsheets:3.3.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'

    implementation 'androidx.fragment:fragment-ktx:1.9.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Ads
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation "com.android.billingclient:billing:9.1.0"

    // Hilt
    implementation("com.google.dagger:hilt-android:2.60.1")
    kapt("com.google.dagger:hilt-android-compiler:2.60.1")

    implementation project(path: ':metroview')
}

// Allow references to generated code
kapt {
    correctErrorTypes true
}
